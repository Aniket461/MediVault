<section class="banner">
  <p class="banner-line">Your records. Their opinion.</p>
</section>
<section class="card auth">
  <div class="page-title">
    <app-icon name="lock" />
    <h1>Sign in</h1>
  </div>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <span class="field">
        <app-icon name="mail" />
        <input type="email" formControlName="email" autocomplete="email" />
      </span>
    </label>
    <label>
      Password
      <span class="field">
        <app-icon name="lock" />
        <input type="password" formControlName="password" autocomplete="current-password" />
      </span>
    </label>
    @if (message()) {
      <p class="note error">
        <app-icon name="x" />
        <span>{{ message() }}</span>
      </p>
    }
    <button type="submit" [disabled]="submitting()">
      <app-icon name="check" />
      Sign in
    </button>
  </form>
  <p class="sub">No account yet? <a routerLink="/register">Create one</a>.</p>
</section>
